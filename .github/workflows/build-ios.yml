name: Build Unsigned iOS IPA

# Run manually from the Actions tab whenever you want a fresh build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          cd ios/JarvisAI
          xcodebuild build \
            -project JarvisAI.xcodeproj \
            -target JarvisAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package as .ipa
        run: |
          cd ios/JarvisAI/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r JarvisAI.app Payload/
          zip -r JarvisAI-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-unsigned-ipa
          path: ios/JarvisAI/build/Build/Products/Release-iphoneos/JarvisAI-unsigned.ipa
